<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

  <body>
    <header class="site-header">

            </li>

            <li class="project-item" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="200">

                <a href="https://typefoodwebsite.netlify.app/" target="_blank">

            </li>

            <li class="project-item" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="300">

              <div class="project-img-box">
                <a href="https://hotelwebste.netlify.app/" target="_blank">
                  <img class="project-img" src="images/hotel.png" alt="Hotel Website" />
                  <div class="project-overlay"><span>View Project</span></div>
                </a>
              </div>
              <p class="project-desc">Hotel</p>
            </li>
          </ul>
        </div>

    <script>
      AOS.init({
        once: true /* Animatsiya sahifa aylantirilganda bir marta silliq ishlaydi */
